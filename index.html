<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet">
        <title>Welcome</title>
        <style>
            :root{
            --bg:#d9e6de;
            --card:#ffffff;
            --accent:#2563eb;
            --correct:#16a34a;
            --wrong:#dc2626;
            }

            *{box-sizing:border-box}

            body{
            margin:0;
            font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
            background:var(--bg);
            padding:16px;
            }

            .container{
            max-width:1000px;
            margin:auto;
            background:var(--card);
            padding:30px;
            border-radius:14px;
            box-shadow:0 6px 24px rgba(0,0,0,.06);
            }

            h1{
            font-size:1.2rem;
            margin:0 0 12px;
            }

            .butt:hover {
            background: rgb(55, 85, 55);
            }
            .welcome{text-align: center;padding: 5px;}

            .butt {
                background: rgb(85, 148, 85);
                border-radius: 16px;
                padding: 15px;
                text-align: center;
                text-decoration: none;
                font-size: larger;
                font-weight: bold;
                border:none;
                transition: transform 0.25s ease, box-shadow 0.25s ease;
                }
            .butt:hover {
                transform: scale(1.08);   /* 👈 zoom */
                box-shadow: 0 6px 15px rgba(0,0,0,0.25);
                }

            .butt a {
            color: white;              /* ⭐ quan trọng */
            text-decoration: none;     /* bỏ gạch chân */
            font-weight: bold;
            display: block;            /* click full nút */
            }

            .center-img {
            width: 200px;
            display: block;
            margin: 20px auto;
            }

            .device{text-align: center;font-weight: bold;font-size: 1.1rem;align-items: center;}

            /* ===== GRID CHÍNH ===== */
            .menu-grid{
                display:grid;
                grid-template-columns: repeat(2, 260px); /* 👈 cố định đẹp */
                justify-content:center;
                gap:16px;
                margin:30px auto 50px;
            }

            /* ===== BUTTON ===== */
            .butt{
            width:100%;
            min-height:52px;
            max-width:260px;  /* desktop */

            /* ===== IMAGE ===== */
            .center-img{
                max-width:100%;
                width:180px;
            }

            /* ===== MOBILE: 1 NÚT / 1 DÒNG ===== */
            @media (max-width: 600px){
            
                body{
                    padding:6px;
                }
            
                .container{
                    padding:12px;
                    border-radius:12px;
                }
            
                h1{
                    font-size:1.05rem;
                    line-height:1.3;
                    text-align:center;
                }
            
                .device{
                    font-size:0.95rem;
                    margin:10px 0 6px;
                    text-align:center;
                }
            
                .menu-grid{
                    display:grid;
                    grid-template-columns: 1fr;   /* 👈 1 nút / dòng */
                    gap:10px;
                    width:100%;
                    margin:12px 0 24px;
                }
            
                .butt{
                    width:100%;
                    max-width:100%;
                    font-size:1rem;
                    padding:12px 10px;
                    min-height:48px;              /* chuẩn mobile */
                    border-radius:14px;
                    box-sizing:border-box;
                }
            
                .butt a{
                    display:block;
                    white-space:nowrap;
                    overflow:hidden;
                    text-overflow:ellipsis;
                }
            
                /* Tắt hover trên mobile */
                .butt:hover{
                    transform:none;
                    box-shadow:none;
                }
            }

            /* ===== TABLET (iPad) ===== */
            @media (min-width: 601px) and (max-width: 1024px){

                body{
                    padding:14px;
                }

                .container{
                    padding:24px;
                    border-radius:14px;
                }

                h1{
                    font-size:1.25rem;
                }

                @media (max-width:1024px){
                    .menu-grid{
                        grid-template-columns: repeat(2, 1fr);
                        max-width:600px;
                        margin:24px auto 40px;
                    }
                }

                .device{
                    font-size:1.05rem;
                }

                .butt{
                    font-size:1.05rem;
                    padding:16px;
                    max-width:100%;
                }

                /* Hover nhẹ cho tablet */
                .butt:hover{
                    transform: scale(1.03);
                    box-shadow:0 4px 10px rgba(0,0,0,0.18);
                }

                .center-img{
                    width:190px;
                }
            }
        </style>

    </head>
    <body>
        <div class="container">
        <h1 style="text-align: center;font-size:x-large;color:#117837"><strong>GÓC TỰ ÔN TẬP DÀNH CHO HỌC VIÊN</strong></h1>
        <p class="welcome">Chào mừng em đến với góc luyện tập Tiếng Anh dành cho học viên của Ms.Nhung</p>
        <img src="welcome.png" alt="Welcome" class="center-img">
        <p style="text-align: center;">Chọn lớp và thiết bị em đang dùng</p>
        <div class="device">MÁY TÍNH/ LAPTOP</div>
            <div class="menu-grid">
            <button class="butt"><a href="tuvungtienganhlop2.html" target="_self">💻 LỚP 2</a></button>
            <button class="butt"><a href="tuvungtienganhlop3.html" target="_self">💻 LỚP 3</a></button>
            <button class="butt"><a href="tuvungtienganhlop4.html" target="_self">💻 LỚP 4</a></button>
            <button class="butt"><a href="tuvungtienganhlop5.html" target="_self">💻 LỚP 5</a></button>
            </div>
        <div class="device">ĐIỆN THOẠI/ MÁY TÍNH BẢNG</div>
            <div class="menu-grid">
            <button class="butt"><a href="mtuvungtienganhlop2.html" target="_self">📱 LỚP 2</a></button>
            <button class="butt"><a href="mtuvungtienganhlop3.html" target="_self">📱 LỚP 3</a></button>
            <button class="butt"><a href="mtuvungtienganhlop4.html" target="_self">📱 LỚP 4</a></button>    
            <button class="butt"><a href="mtuvungtienganhlop5.html" target="_self">📱 LỚP 5</a></button>
        </div>
        </div>
    </body>    
</html>
